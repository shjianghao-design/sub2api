# =============================================================================
# Sub2API Docker Compose - Hot-Reload Development Stack
# =============================================================================
# Runs PostgreSQL and Redis in Docker, then runs backend/frontend from the local
# source tree inside development containers.
#
# Usage:
#   cd deploy
#   cp .env.dev.example .env.dev
#   docker compose --env-file .env.dev -f docker-compose.dev-hot.yml up --build
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:8080
# =============================================================================

services:
  backend:
    image: golang:1.26.4-alpine
    container_name: sub2api-backend-hot
    working_dir: /workspace/backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    volumes:
      - ../backend:/workspace/backend
      - backend_go_cache:/go
      - backend_build_cache:/root/.cache/go-build
      - ./dev_data/backend:/workspace/data
    environment:
      - AUTO_SETUP=true
      - DATA_DIR=/workspace/data
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=debug
      - RUN_MODE=${RUN_MODE:-standard}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-sub2api}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2api}
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sub2api.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}
      - TZ=${TZ:-Asia/Shanghai}
      - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
      - GOSUMDB=${GOSUMDB:-sum.golang.google.cn}
      - UPDATE_PROXY_URL=${UPDATE_PROXY_URL:-}
      - GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT=${GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT:-0}
      - GATEWAY_OPENAI_HTTP2_ENABLED=${GATEWAY_OPENAI_HTTP2_ENABLED:-true}
      - GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1=${GATEWAY_OPENAI_HTTP2_ALLOW_PROXY_FALLBACK_TO_HTTP1:-true}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD=${GATEWAY_OPENAI_HTTP2_FALLBACK_ERROR_THRESHOLD:-2}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS=${GATEWAY_OPENAI_HTTP2_FALLBACK_WINDOW_SECONDS:-60}
      - GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS=${GATEWAY_OPENAI_HTTP2_FALLBACK_TTL_SECONDS:-600}
      - GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT=${GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT:-900}
      - GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL=${GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL:-10}
      - GATEWAY_IMAGE_CONCURRENCY_ENABLED=${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      - GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE=${GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE:-reject}
      - GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS=${GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-30}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS:-100}
    command: >
      sh -c "
        apk add --no-cache git ca-certificates tzdata &&
        go mod download &&
        go run ./cmd/server
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sub2api-dev-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: node:24-alpine
    container_name: sub2api-frontend-hot
    working_dir: /workspace/frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${VITE_DEV_PORT:-3000}:${VITE_DEV_PORT:-3000}"
    volumes:
      - ../frontend:/workspace/frontend
      - ../docs:/workspace/docs:ro
      - frontend_node_modules:/workspace/frontend/node_modules
      - frontend_pnpm_store:/pnpm/store
    environment:
      - VITE_DEV_PORT=${VITE_DEV_PORT:-3000}
      - VITE_DEV_PROXY_TARGET=http://backend:8080
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api/v1}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-true}
      - TZ=${TZ:-Asia/Shanghai}
    command: >
      sh -c "
        corepack enable &&
        corepack prepare pnpm@9 --activate &&
        pnpm config set store-dir /pnpm/store &&
        if [ ! -f node_modules/.modules.yaml ]; then
          pnpm install --frozen-lockfile=false --lockfile=false;
        fi &&
        pnpm run dev -- --host 0.0.0.0 --port ${VITE_DEV_PORT:-3000}
      "
    depends_on:
      backend:
        condition: service_started
    networks:
      - sub2api-dev-network

  postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres-hot
    restart: unless-stopped
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./dev_data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sub2api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - PGDATA=/var/lib/postgresql/data
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - sub2api-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: sub2api-redis-hot
    restart: unless-stopped
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - ./dev_data/redis:/data
    command: >
      sh -c '
        redis-server
        --save 60 1
        --appendonly yes
        --appendfsync everysec
        ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    networks:
      - sub2api-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  sub2api-dev-network:
    driver: bridge

volumes:
  backend_go_cache:
  backend_build_cache:
  frontend_node_modules:
  frontend_pnpm_store:
